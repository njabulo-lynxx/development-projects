<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>

            .parent {
                position: relative;
            }

            .notification {
                position: absolute;
                top: 10px;
                right: 10px;
            }
        </style>
        <title>Position</title>
    </head>
    <body>
        <div class="parent">
            <h2>Messages</h2>
            <span class="notification">3</span>
        </div>
    </body>
</html>
