<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            .container {
                outline: 1px solid red;
                display: flex;
                flex-direction: row;
                width: 900px;
                gap: 20px;
            }

            .item {
                outline: 1px solid blue;
                flex-basis: 150px;
                flex-grow: 1;
            }

            .featured {
                flex-grow: 2;
            }
        </style>
        <title>Flex Grow</title>
    </head>
    <body>
        <div class="container">
            <div class="item">Card One</div>
            <div class="item featured">Card Two</div>
            <div class="item">Card Three</div>
        </div>
    </body>
</html>
