<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Arrays</title>
</head>
<body>
    <script>
        //Array example 1
        console.log("Example 1")

        numbers = []
        numbers.push("One")
        numbers.push("Two")
        numbers.push("Three")
        
        for (i = 0; i < numbers.length; i++)
          console.log("Element " + i + " = " + numbers[i])

        //Array example 2
        console.log("Example 2")

        words = []
        words[0] = "Ten"
        words[1] = "Twenty"
        words[2] = "Thirty"

        for (i = 0; i < words.length; i++)
          console.log("Element " + i + " = " + words[i])
    </script>
</body>
</html>
