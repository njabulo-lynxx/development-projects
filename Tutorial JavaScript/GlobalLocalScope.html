<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global & Local Scope</title>
</head>
<body>
    <script>
        //Test to see which of the following variables are global or local
        test()

        if (typeof a != "undefined") console.log("a = " + a + " is global") 
        if (typeof b != "undefined") console.log("b = " + b + " is global") 
        if (typeof c != "undefined") console.log("c = " + c + " is global")

        function test() {
            //Global scope
            a = 123
            //Local scope
            var b = 456

            if (a == 123) var c = 789
        }
    </script>
</body>
</html>
